name: Signaler une erreur
description: Une organisation manque, un lien est faux, une date ou un nom est inexact.
title: "[Erreur] "
labels: ["retour"]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour votre retour. Chaque lien de l'arbre doit reposer sur une source : si vous en connaissez une
        (article Wikipédia, livre, archive), indiquez-la, c'est ce qui permet de corriger.
  - type: dropdown
    id: nature
    attributes:
      label: De quoi s'agit-il ?
      options:
        - Une organisation manque
        - Un lien est faux ou manque (scission, fusion, renommage…)
        - Une date est inexacte
        - Un nom ou un sigle est inexact
        - Une Internationale ou un média
        - Lisibilité ou affichage
        - Autre
    validations:
      required: true
  - type: input
    id: organisation
    attributes:
      label: Organisation(s) concernée(s)
      placeholder: "ex. PSU, Ligue communiste (1930)"
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui est affiché, et ce qui serait juste
      placeholder: "ex. l'arbre montre une scission en 1936, il s'agit d'une fusion en 1937"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Lien vers un article Wikipédia, une référence de livre, une archive…
    validations:
      required: false
