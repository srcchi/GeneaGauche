# Publication du site sur GitHub Pages : la page d'accueil (site/), les arbres déjà produits (arbres/) et
# l'application (app/, React), construite ici à partir de app/public/graphe.json (scripts/export.py).
# Les données ne sont pas recalculées ici : on publie ce qui a été généré et committé par la chaîne.
# Deux jobs, comme le modèle officiel de GitHub : « construire » envoie l'artefact, « publier » le déploie une
# fois le premier terminé (dans un seul job, la publication ne trouvait plus l'artefact : « No artifacts named
# github-pages were found »). En cas d'échec passager : bouton « Re-run jobs » dans l'onglet Actions.
name: Site GitHub Pages

on:
  push:
    branches: [main]          # GitHub Pages ne publie que depuis main (règle de l'environnement github-pages)
    paths: ["site/**", "arbres/**", "app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Construire l'application (tests compris)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Assembler le site
        run: |
          mkdir -p _site/arbres
          cp -r site/. _site/
          cp arbres/*.html arbres/*.svg _site/arbres/
          cp arbres/*.pdf _site/arbres/ 2>/dev/null || true
          mkdir -p _site/app
          cp -r app/dist/. _site/app/
          ls -la _site _site/arbres
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
